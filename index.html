<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Global de Mentores · Global Mentoring Network · Rede Global de Mentores</title>
<meta name="description" content="Welcome · Bienvenid@ · Bem-vindo. Elige tu idioma · Choose your language · Escolhe o teu idioma.">
<link rel="canonical" href="https://www.redglobaldementores.org/">
<link rel="alternate" hreflang="es" href="https://www.redglobaldementores.org/es/">
<link rel="alternate" hreflang="pt-PT" href="https://www.redglobaldementores.org/pt/">
<link rel="alternate" hreflang="en-GB" href="https://www.redglobaldementores.org/en/">
<link rel="alternate" hreflang="x-default" href="https://www.redglobaldementores.org/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Poppins,"Helvetica Neue",Arial,sans-serif;color:#fff;background:#1f2555}
.portada{position:relative;min-height:100vh;display:grid;place-items:center;text-align:center;padding:48px 20px;overflow:hidden;
  background:linear-gradient(rgba(52,62,140,.78),rgba(31,37,85,.88)),linear-gradient(160deg,#343e8c,#1f2555)}
.portada::after{content:"";position:absolute;right:-90px;bottom:-110px;width:min(46vw,520px);aspect-ratio:1;background:url("img/logo-argollas.svg") center/contain no-repeat;opacity:.55;pointer-events:none}
.contenido{position:relative;z-index:1;width:min(920px,100%)}
h1{margin:0 0 44px;font-weight:800;font-size:clamp(34px,7vw,76px);line-height:1.08;text-transform:uppercase}
h1 span{display:block}
.nombres{margin:0 0 44px;font-weight:700;font-size:clamp(20px,4.2vw,46px);line-height:1.25;text-transform:uppercase}
.nombres span{display:block}
.idiomas{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.idiomas a{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#1f2555;text-decoration:none;font-weight:600;font-size:clamp(16px,2vw,22px);padding:14px 30px;border-radius:999px;border:3px solid transparent;transition:transform .15s,border-color .15s}
.idiomas a img{width:32px;height:auto;border-radius:3px}
.idiomas a:hover,.idiomas a:focus-visible{transform:translateY(-2px);border-color:#a79738;outline:none}
.idiomas a.sugerido{border-color:#d4c35a;box-shadow:0 0 0 4px rgba(212,195,90,.35)}
@media(max-width:560px){.idiomas{flex-direction:column;align-items:stretch}.idiomas a{justify-content:center}}
</style>
</head>
<body>
<main class="portada">
  <div class="contenido">
    <h1><span>Welcome</span><span>Bienvenid@</span><span>Bem-vindo</span></h1>
    <p class="nombres"><span>Global Mentoring Network</span><span>Red Global de Mentores</span><span>Rede Global de Mentores</span></p>
    <nav class="idiomas" aria-label="Idioma · Language · Língua">
      <a href="en/" hreflang="en-GB" lang="en" data-idioma="en"><img src="img/bandera-gb.png" width="196" height="132" alt="">Go to GMN</a>
      <a href="es/" hreflang="es" lang="es" data-idioma="es"><img src="img/bandera-es.png" width="196" height="132" alt="">Ir a RGM</a>
      <a href="pt/" hreflang="pt-PT" lang="pt" data-idioma="pt"><img src="img/bandera-pt.png" width="196" height="132" alt="">Vai ReGM</a>
    </nav>
  </div>
</main>
<script>
/* Resalta (sin redirigir) el idioma del navegador */
(function(){try{var l=(navigator.languages&&navigator.languages[0]||navigator.language||"").slice(0,2).toLowerCase();
var a=document.querySelector('[data-idioma="'+l+'"]');if(a)a.classList.add("sugerido");}catch(e){}})();
</script>
<script src="/sesion.js" defer></script>
</body>
</html>
