<style>
:root{--bg:#f3f5f7;--surface:#fff;--fg:#14212b;--muted:#53626f;--line:#d5dde4;--navy:#16324a;--teal:#0f7b78;--err:#a32a2a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1820;--surface:#16232d;--fg:#e6edf2;--muted:#9db0bf;--line:#2c3d4a;--navy:#8fb8dc;--teal:#4cc2bd;--err:#ff8a8a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
h1{font:700 22px/1.25 Georgia,serif;color:var(--navy);margin:0}
p{margin:0;color:var(--muted);font-size:14.5px}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button{font:600 15px inherit;font-family:inherit;padding:10px;border-radius:8px;border:0;background:var(--teal);color:var(--surface);cursor:pointer}
#e{color:var(--err);font-size:14px;min-height:1.3em}
</style></head><body>
